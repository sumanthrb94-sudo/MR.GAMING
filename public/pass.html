<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your pass · MR. GAMING</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0B0A">
  <link rel="icon" type="image/png" href="/assets/images/logo-96.png">
  <link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M17 7L7 17"/><path d="M8 7h9v9"/></symbol>
  </svg>

  <header class="topbar is-scrolled">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="MR. GAMING home">
        <img src="/assets/images/logo-96.webp" width="36" height="36" alt="">
        <span class="brand-name">MR. GAMING</span>
      </a>
    </div>
  </header>

  <main class="wrap pass-main">
    <section class="card pass-card" id="pass" aria-live="polite">
      <p class="eyebrow" id="pass-kind">Your pass</p>
      <h1 class="pass-hi" id="pass-hi">Loading your hours…</h1>
      <div class="pass-hours" id="pass-hours" hidden>
        <span class="pass-left" id="pass-left"></span>
        <span class="pass-of" id="pass-of"></span>
      </div>
      <div class="pass-bar" id="pass-bar" hidden><span id="pass-fill"></span></div>
      <p class="pass-meta" id="pass-meta"></p>
      <div class="actions" id="pass-actions" hidden>
        <a class="btn btn-accent press" id="pass-book" href="/#book">Book with my pass <svg class="i"><use href="#i-arrow"/></svg></a>
        <a class="btn btn-ghost press" id="pass-wa" href="https://wa.me/917337230311" target="_blank" rel="noopener"><svg class="i"><use href="#i-wa"/></svg> WhatsApp us</a>
      </div>
      <p class="pass-note">Updates on its own when we add or use hours.</p>
    </section>
  </main>

  <script type="module" src="/assets/js/pass.js"></script>
</body>
</html>
