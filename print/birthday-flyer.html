<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><title>MR. Sandwich · Birthday package flyer</title>
<!-- The owner's birthday flyer with the new package. The base layer is their artwork as they sent it (birthday-flyer-source.jpg, 853 × 1280);
     this page only paints over two parts of it: the price burst and the food band. Everything else is the original pixels.
     Prices must match CONFIG.birthday in public/assets/js/main.js. Render: node scripts/make-birthday-flyer.mjs -->
<style>
@font-face { font-family: "Archivo"; src: url("../public/assets/fonts/archivo.woff2") format("woff2"); font-weight: 400 900; font-stretch: 96% 125%; }
/* colours picked from the artwork; Archivo has no ₹, so Inter draws it */
:root { --cream: #FCF5E3; --red: #F60438; --pink: #F60650; --yellow: #FEE133; --white: #FFFFFF; --ink: #0D0E0D; --navy: #060D18; --splash: #FDD641; --spark: #F7CC2C;
        --line: #4A2615; --shadow: rgba(74,38,21,.12); --plate: #FFFFFF; --plate-2: #F3EBDA;
        --crust: #E9A23B; --crust-2: #F6C26A; --cheese: #FFD45E; --sauce: #E8432B; --mozz: #FFF7E0; --leaf: #2E9B4E; --leaf-2: #57C26E;
        --bowl: #1E96E8; --bowl-2: #7CC6F5; --cream-sauce: #FFF3D6; --penne: #F4C25E; --penne-2: #D9993A;
        --glaze: #E2602C; --glaze-2: #F99A62; --garlic: #FFF1D2; --onion: #5DBB4A; --onion-2: #E2F5CF;
        --nugget: #F0A33E; --nugget-2: #D7832A; --crumb: #FFD27E; --filling: #FFE27A; --corn: #FFC21F;
        --glass: rgba(255,255,255,.5); --mojito: #8FDB98; --mojito-2: #C8F0C4; --boba: #3A2216; --lime: #CBE65C; --lime-2: #7DB83A; --pith: #F3FAD9; --ice: rgba(240,255,255,.75);
        --sans: "Archivo", "Inter", sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 853px; height: 1280px; overflow: hidden; }
body { position: relative; background: var(--cream); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.base, .art { position: absolute; left: 0; top: 0; width: 853px; height: 1280px; }
.art { overflow: hidden; }
/* the burst: its outline is traced from the old one, so the new one covers it exactly (the right side runs off the page, like the original) */
.burst { fill: var(--red); stroke: var(--white); stroke-width: 9; paint-order: stroke; }
.stitch { fill: none; stroke: var(--white); stroke-width: 2.4; stroke-dasharray: 7 5.5; stroke-linecap: round; }
.price { position: absolute; left: 748px; top: 271px; transform: translate(-50%, -50%) rotate(-13deg); text-align: center; text-transform: uppercase; white-space: nowrap; color: var(--white); }
.price .hrs, .price .per { display: block; font: 900 26px/1 var(--sans); font-stretch: 100%; letter-spacing: .01em; }
.price b { display: block; margin: 2px 0 0; font: 900 74px/.92 var(--sans); font-stretch: 100%; letter-spacing: -.03em; color: var(--yellow); }
.price .rs { display: inline-block; margin-right: .03em; font-size: .68em; vertical-align: .14em; letter-spacing: 0; }
/* food band: plain background over the old photos, then the yellow splash and the sparkle that were behind them */
.paper { fill: var(--cream); }
.splash { fill: var(--splash); } .spark { fill: var(--spark); }
.food { position: absolute; left: 0; top: 866px; width: 853px; height: 164px; }
.items { list-style: none; display: grid; grid-template-columns: repeat(5, 150px); column-gap: 13px; justify-content: center; }
.items li { position: relative; text-align: center; }
/* the flyer's "+" between dishes */
.items li + li::before, .items li + li::after { content: ""; position: absolute; left: -6.5px; top: 47px; width: 22px; height: 6px; border-radius: 3px; background: var(--navy); transform: translate(-50%, -50%); }
.items li + li::after { width: 6px; height: 22px; }
.ill { display: block; width: 148px; height: 97px; margin: 0 auto; overflow: visible; }
.ill * { stroke: var(--line); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.ill .x, .ill .x * { stroke: none; }
.ill .thin, .ill .thin * { stroke-width: 1.4; }
.items p { margin-top: 3px; font: 800 17px/1.08 var(--sans); font-stretch: 96%; letter-spacing: .005em; text-transform: uppercase; color: var(--ink); }
.adults { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font: 800 16.5px/1 var(--sans); font-stretch: 100%; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
.adults b { font-weight: 900; color: var(--pink); }
/* illustration fills, dish by dish */
.sh { fill: var(--shadow); } .plate { fill: var(--plate); } .plate-2 { fill: var(--plate-2); } .white { fill: var(--white); } .pink { fill: var(--pink); } .leaf { fill: var(--leaf); } .leaf-2 { fill: var(--leaf-2); } .none { fill: none; }
.crust { fill: var(--crust); } .crust-2 { fill: var(--crust-2); } .cheese { fill: var(--cheese); } .sauce { fill: var(--sauce); } .mozz { fill: var(--mozz); }
.bowl { fill: var(--bowl); } .bowl-2 { fill: var(--bowl-2); } .cream-sauce { fill: var(--cream-sauce); } .penne { fill: var(--penne); } .penne-2 { fill: var(--penne-2); }
.glaze { fill: var(--glaze); } .glaze-2 { fill: var(--glaze-2); } .garlic { fill: var(--garlic); } .onion { fill: var(--onion); } .onion-2 { fill: var(--onion-2); }
.nugget { fill: var(--nugget); } .nugget-2 { fill: var(--nugget-2); } .crumb { fill: var(--crumb); } .filling { fill: var(--filling); } .corn { fill: var(--corn); }
.glass { fill: var(--glass); } .mojito { fill: var(--mojito); } .mojito-2 { fill: var(--mojito-2); } .boba { fill: var(--boba); } .ice { fill: var(--ice); } .lime { fill: var(--lime); } .lime-2 { fill: var(--lime-2); } .pith { fill: var(--pith); }
.ill .ridge { fill: none; stroke: var(--penne-2); stroke-width: 1.3; } /* penne ridges */
.ill .seg { fill: none; stroke: var(--pith); stroke-width: 1.3; } /* lime segments */
</style></head><body>
